name: Build Android APK

on:
  push:
    branches: [main, ui/compact-bottom-navigation, feature/player-toolbar-utilities, feature/library-content-list, feature/floating-audio-mixer-controls, fix/full-track-bookmarks-smart-player, feature/consolidated-library-mixer-bookmarks, feature/internet-radio-player]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-player-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
